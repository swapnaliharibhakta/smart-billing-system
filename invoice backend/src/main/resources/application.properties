spring.application.name=invoice
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/invoicedb
spring.datasource.username=invoiceadmin
spring.datasource.password=invoiceadmin
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.default-schema=public
spring.jpa.open-in-view=false

app.jwt.secret=change-this-to-a-long-random-string-of-at-least-32-chars
app.jwt.expiration-ms=86400000
server.error.include-message=always

